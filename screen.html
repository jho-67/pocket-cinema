<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cinema Screen</title>
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #050505;
      color: #fff;
      font-family: sans-serif;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    #glow {
      position: absolute;
      width: 80vw;
      height: 50vw;
      border-radius: 40px;
      filter: blur(60px);
      opacity: 0.35;
      pointer-events: none;
      transition: background 0.3s;
    }

    /* Stage Container (can enter native fullscreen) */
    .stage {
      position: relative;
      width: 94vw;
      max-width: 1000px;
      aspect-ratio: 16 / 9;
      background: #000;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 20px 50px rgba(0,0,0,0.9);
    }
    /* When Fullscreen, stretch edge-to-edge like YouTube */
    .stage:fullscreen, .stage:-webkit-full-screen {
      width: 100vw !important;
      height: 100vh !important;
      max-width: none !important;
      border-radius: 0 !important;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      image-rendering: -webkit-optimize-contrast; /* Sharpen decoded frames */
    }

    .curtain {
      position: absolute;
      top: 0; bottom: 0; width: 50.5%;
      background: repeating-linear-gradient(90deg, #7a0c16 0px, #3b0006 18px, #7a0c16 36px);
      transition: transform 2.2s cubic-bezier(0.65, 0, 0.35, 1);
      z-index: 5;
    }
    .curtain.left { left: 0; transform-origin: left center; }
    .curtain.right { right: 0; transform-origin: right center; }
    .stage.open .curtain.left { transform: scaleX(0.05) translateX(-50%); }
    .stage.open .curtain.right { transform: scaleX(0.05) translateX(50%); }

    /* Code Pairing Box */
    #box {
      position: absolute;
      z-index: 10;
      background: rgba(15,15,15,0.95);
      border: 1px solid #333;
      border-radius: 12px;
      padding: 24px;
      text-align: center;
    }
    #code { font-size: 3.5rem; letter-spacing: 6px; color: #d4af37; font-weight: bold; margin: 10px 0; }

    /* YouTube-style Fullscreen Button in corner */
    #fs-btn {
      display: none;
      position: absolute;
      bottom: 12px;
      right: 12px;
      z-index: 25;
      background: rgba(0,0,0,0.65);
      color: #fff;
      border: 1px solid #444;
      border-radius: 6px;
      padding: 8px 12px;
      font-size: 0.9rem;
      cursor: pointer;
      backdrop-filter: blur(4px);
    }

    /* Tap for Audio prompt */
    #tap-to-unmute {
      display: none;
      position: absolute;
      z-index: 20;
      background: #d4af37;
      color: #000;
      padding: 12px 24px;
      border-radius: 8px;
      font-weight: bold;
      border: none;
      font-size: 1rem;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div id="glow"></div>

  <div class="stage" id="stage">
    <div class="curtain left"></div>
    <div class="curtain right"></div>
    <video id="screen" autoplay playsinline muted></video>
    <!-- On-screen YouTube style fullscreen button -->
    <button id="fs-btn" onclick="toggleFullscreen()">⛶ Fullscreen</button>
  </div>

  <button id="tap-to-unmute" onclick="enableAudio()">Tap for Theater Audio 🔊</button>

  <div id="box">
    <p style="color:#aaa;">Screen Code:</p>
    <div id="code">----</div>
    <p style="color:#666; font-size:0.8rem;">Waiting for Director...</p>
  </div>

  <script>
    const code = Math.floor(1000 + Math.random() * 9000).toString();
    document.getElementById('code').textContent = code;

    const peer = new Peer('cinehall-' + code);
    const screen = document.getElementById('screen');
    const stage = document.getElementById('stage');
    const unmuteBtn = document.getElementById('tap-to-unmute');
    const fsBtn = document.getElementById('fs-btn');

    peer.on('connection', (conn) => {
      conn.on('data', (data) => {
        if (data.type === 'control') {
          if (data.action === 'curtains') stage.classList.toggle('open');
          if (data.action === 'fullscreen') toggleFullscreen();
        }
      });
    });

    peer.on('call', (call) => {
      call.answer();

      call.on('stream', (remoteStream) => {
        document.getElementById('box').style.display = 'none';

        screen.srcObject = remoteStream;
        screen.play().then(() => {
          stage.classList.add('open');
          unmuteBtn.style.display = 'block';
          fsBtn.style.display = 'block';
          setupGlow(screen);
        });
      });
    });

    function enableAudio() {
      screen.muted = false;
      screen.volume = 1.0;
      unmuteBtn.style.display = 'none';
    }

    // Native Mobile Fullscreen (Locks into landscape mode)
    function toggleFullscreen() {
      const el = stage;
      if (!document.fullscreenElement && !document.webkitFullscreenElement) {
        if (el.requestFullscreen) {
          el.requestFullscreen();
        } else if (el.webkitRequestFullscreen) {
          el.webkitRequestFullscreen();
        }
        // Rotate screen to horizontal landscape if device supports it
        if (screen.orientation && screen.orientation.lock) {
          screen.orientation.lock('landscape').catch(() => {});
        }
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen();
        } else if (document.webkitExitFullscreen) {
          document.webkitExitFullscreen();
        }
      }
    }

    function setupGlow(videoEl) {
      const glow = document.getElementById('glow');
      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext('2d', { willReadFrequently: true });
      canvas.width = 16; canvas.height = 9;

      setInterval(() => {
        if (!videoEl.paused && !videoEl.ended) {
          ctx.drawImage(videoEl, 0, 0, 16, 9);
          const d = ctx.getImageData(0, 0, 16, 9).data;
          let r = 0, g = 0, b = 0;
          for (let i = 0; i < d.length; i += 4) { r += d[i]; g += d[i+1]; b += d[i+2]; }
          glow.style.background = `rgb(${Math.round(r/36)}, ${Math.round(g/36)}, ${Math.round(b/36)})`;
        }
      }, 300);
    }
  </script>
</body>
</html>
