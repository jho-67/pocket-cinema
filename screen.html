<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AirStream - Turbo Receiver</title>
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #09090b; color: #fff; font-family: sans-serif;
      padding: 24px 16px; display: flex; justify-content: center; align-items: center; min-height: 100vh;
    }
    .card { background: #18181b; border: 1px solid #27272a; border-radius: 12px; padding: 24px; width: 100%; max-width: 400px; text-align: center; }
    h1 { color: #d4af37; font-size: 1.3rem; margin-bottom: 12px; }
    .code { font-size: 3rem; letter-spacing: 6px; color: #d4af37; font-weight: bold; margin: 12px 0; }
    .bar-bg { width: 100%; height: 8px; background: #27272a; border-radius: 4px; overflow: hidden; margin-top: 14px; }
    .bar-fill { width: 0%; height: 100%; background: #d4af37; transition: width 0.1s; }
    .stats { font-size: 0.8rem; color: #a1a1aa; margin-top: 6px; display: flex; justify-content: space-between; }
    #downloadBtn { display: none; width: 100%; margin-top: 16px; padding: 14px; border: none; border-radius: 8px; background: #22c55e; color: #000; font-weight: bold; font-size: 1rem; cursor: pointer; }
    #speed { color: #22c55e; font-weight: bold; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Turbo Receiver Storage</h1>
    <p style="color:#aaa; font-size:0.85rem;">Receiver Code:</p>
    <div class="code" id="displayCode">----</div>

    <div id="status" style="font-size:0.85rem; color:#a1a1aa;">Waiting for sender...</div>

    <div class="bar-bg"><div id="progress" class="bar-fill"></div></div>
    <div class="stats">
      <span id="transferred">0 MB</span>
      <span id="speed">0 MB/s</span>
      <span id="pct">0%</span>
    </div>

    <button id="downloadBtn" onclick="saveToDevice()">💾 Save to Phone Storage</button>
  </div>

  <script>
    const code = Math.floor(1000 + Math.random() * 9000).toString();
    document.getElementById('displayCode').textContent = code;

    const peer = new Peer('filerecv-' + code);
    let writableStream = null;
    let fileHandle = null;
    let totalSize = 0;
    let receivedBytes = 0;
    let fileName = "video.mp4";
    let lastBytes = 0;
    let lastTime = performance.now();

    peer.on('connection', (conn) => {
      document.getElementById('status').textContent = "Pipelined direct disk write active...";

      conn.on('data', async (data) => {
        if (data.type === 'start') {
          fileName = data.name;
          totalSize = data.size;
          const root = await navigator.storage.getDirectory();
          fileHandle = await root.getFileHandle("turbo_temp_stream", { create: true });
          writableStream = await fileHandle.createWritable();
          lastTime = performance.now();
          return;
        }

        if (data.type === 'eof') {
          await writableStream.close();
          document.getElementById('status').textContent = `Stored on disk (${(totalSize/(1024*1024)).toFixed(1)} MB)!`;
          document.getElementById('downloadBtn').style.display = 'block';
          document.getElementById('speed').textContent = "Complete";
          return;
        }

        if (data instanceof ArrayBuffer && writableStream) {
          // Write chunk directly to storage
          await writableStream.write(data);
          receivedBytes += data.byteLength;

          const pct = Math.min(100, Math.round((receivedBytes / totalSize) * 100));
          document.getElementById('progress').style.width = pct + '%';
          document.getElementById('pct').textContent = pct + '%';
          document.getElementById('transferred').textContent = `${(receivedBytes / (1024*1024)).toFixed(1)} MB`;

          const now = performance.now();
          if (now - lastTime > 400) {
            const speed = ((receivedBytes - lastBytes) / (1024 * 1024)) / ((now - lastTime) / 1000);
            document.getElementById('speed').textContent = `${speed.toFixed(1)} MB/s`;
            lastBytes = receivedBytes;
            lastTime = now;
          }
        }
      });
    });

    async function saveToDevice() {
      const fileData = await fileHandle.getFile();
      const url = URL.createObjectURL(fileData);
      const a = document.createElement('a');
      a.href = url;
      a.download = fileName;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }
  </script>
</body>
</html>
