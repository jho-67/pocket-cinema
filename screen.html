<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cinema Screen</title>
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #050505;
      color: #fff;
      font-family: sans-serif;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    #glow {
      position: absolute;
      width: 80vw;
      height: 50vw;
      border-radius: 40px;
      filter: blur(60px);
      opacity: 0.35;
      pointer-events: none;
      transition: background 0.3s;
    }
    .stage {
      position: relative;
      width: 94vw;
      max-width: 1000px;
      aspect-ratio: 16 / 9;
      background: #000;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 20px 50px rgba(0,0,0,0.9);
    }
    .stage:fullscreen, .stage:-webkit-full-screen {
      width: 100vw !important;
      height: 100vh !important;
      max-width: none !important;
      border-radius: 0 !important;
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      image-rendering: -webkit-optimize-contrast;
    }
    .curtain {
      position: absolute;
      top: 0; bottom: 0; width: 50.5%;
      background: repeating-linear-gradient(90deg, #7a0c16 0px, #3b0006 18px, #7a0c16 36px);
      transition: transform 2.2s cubic-bezier(0.65, 0, 0.35, 1);
      z-index: 5;
    }
    .curtain.left { left: 0; transform-origin: left center; }
    .curtain.right { right: 0; transform-origin: right center; }
    .stage.open .curtain.left { transform: scaleX(0.05) translateX(-50%); }
    .stage.open .curtain.right { transform: scaleX(0.05) translateX(50%); }

    #box {
      position: absolute;
      z-index: 10;
      background: rgba(15,15,15,0.95);
      border: 1px solid #333;
      border-radius: 12px;
      padding: 24px;
      text-align: center;
    }
    #code { font-size: 3.5rem; letter-spacing: 6px; color: #d4af37; font-weight: bold; margin: 10px 0; }
  </style>
</head>
<body>
  <div id="glow"></div>

  <div class="stage" id="stage">
    <div class="curtain left"></div>
    <div class="curtain right"></div>
    <video id="screen" autoplay playsinline muted></video>
  </div>

  <div id="box">
    <p style="color:#aaa;">Screen Code:</p>
    <div id="code">----</div>
    <p style="color:#666; font-size:0.8rem;">Waiting for Director...</p>
  </div>

  <script>
    const code = Math.floor(1000 + Math.random() * 9000).toString();
    document.getElementById('code').textContent = code;

    const peer = new Peer('cinehall-' + code);
    const screen = document.getElementById('screen');
    const stage = document.getElementById('stage');
    let audioCtx = null;
    let wakeLock = null;

    async function requestWakeLock() {
      try {
        if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen');
      } catch (err) {}
    }

    // Zero-touch Audio Context routing
    function routeAudioThroughWebAudio(stream) {
      try {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AudioContextClass();
        const audioTracks = stream.getAudioTracks();
        if (audioTracks.length > 0) {
          const audioStream = new MediaStream([audioTracks[0]]);
          const source = audioCtx.createMediaStreamSource(audioStream);
          source.connect(audioCtx.destination);
          if (audioCtx.state === 'suspended') {
            audioCtx.resume();
          }
        }
      } catch (e) {
        screen.muted = false;
        screen.volume = 1.0;
      }
    }

    peer.on('connection', (conn) => {
      conn.on('data', (data) => {
        if (data.type === 'control') {
          if (data.action === 'curtains') stage.classList.toggle('open');
          if (data.action === 'fullscreen') {
            if (stage.requestFullscreen) stage.requestFullscreen();
            else if (stage.webkitRequestFullscreen) stage.webkitRequestFullscreen();
          }
        }
      });
    });

    peer.on('call', (call) => {
      call.answer();

      call.on('stream', (remoteStream) => {
        document.getElementById('box').style.display = 'none';

        screen.srcObject = remoteStream;
        screen.play().then(() => {
          stage.classList.add('open');
          setupGlow(screen);
          requestWakeLock();
        });

        routeAudioThroughWebAudio(remoteStream);
      });
    });

    function setupGlow(videoEl) {
      const glow = document.getElementById('glow');
      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext('2d', { willReadFrequently: true });
      canvas.width = 16; canvas.height = 9;

      setInterval(() => {
        if (!videoEl.paused && !videoEl.ended) {
          ctx.drawImage(videoEl, 0, 0, 16, 9);
          const d = ctx.getImageData(0, 0, 16, 9).data;
          let r = 0, g = 0, b = 0;
          for (let i = 0; i < d.length; i += 4) { r += d[i]; g += d[i+1]; b += d[i+2]; }
          glow.style.background = `rgb(${Math.round(r/36)}, ${Math.round(g/36)}, ${Math.round(b/36)})`;
        }
      }, 300);
    }
  </script>
</body>
</html>
