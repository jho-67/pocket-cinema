<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cinema Screen</title>
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #050505;
      color: #fff;
      font-family: sans-serif;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #glow {
      position: absolute;
      width: 80vw;
      height: 50vw;
      border-radius: 40px;
      filter: blur(60px);
      opacity: 0.35;
      pointer-events: none;
      transition: background 0.3s;
    }
    .stage {
      position: relative;
      width: 92vw;
      max-width: 960px;
      aspect-ratio: 16 / 9;
      background: #000;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 20px 50px rgba(0,0,0,0.9);
    }
    video { width: 100%; height: 100%; object-fit: contain; }
    .curtain {
      position: absolute;
      top: 0; bottom: 0; width: 50.5%;
      background: repeating-linear-gradient(90deg, #7a0c16 0px, #3b0006 18px, #7a0c16 36px);
      transition: transform 2.2s ease-in-out;
      z-index: 5;
    }
    .curtain.left { left: 0; transform-origin: left center; }
    .curtain.right { right: 0; transform-origin: right center; }
    .stage.open .curtain.left { transform: scaleX(0.05) translateX(-50%); }
    .stage.open .curtain.right { transform: scaleX(0.05) translateX(50%); }
    #box {
      position: absolute;
      z-index: 10;
      background: rgba(15,15,15,0.95);
      border: 1px solid #333;
      border-radius: 12px;
      padding: 24px;
      text-align: center;
    }
    #code { font-size: 3.5rem; letter-spacing: 6px; color: #d4af37; font-weight: bold; margin: 10px 0; }
  </style>
</head>
<body>
  <div id="glow"></div>
  <div class="stage" id="stage">
    <div class="curtain left"></div>
    <div class="curtain right"></div>
    <video id="screen" playsinline></video>
  </div>

  <div id="box">
    <p style="color:#aaa;">Screen Code:</p>
    <div id="code">----</div>
    <p style="color:#666; font-size:0.8rem;">Waiting for host...</p>
  </div>

  <script>
    const code = Math.floor(1000 + Math.random() * 9000).toString();
    document.getElementById('code').textContent = code;

    const peer = new Peer('cinehall-' + code);
    const screen = document.getElementById('screen');
    const stage = document.getElementById('stage');
    let mediaSource, sourceBuffer, queue = [], started = false;

    peer.on('connection', (conn) => {
      conn.on('data', (data) => {
        if (data.type === 'control') {
          if (data.action === 'toggle') screen.paused ? screen.play() : screen.pause();
          if (data.action === 'rewind') screen.currentTime -= 10;
          if (data.action === 'forward') screen.currentTime += 10;
          if (data.action === 'unmute') { screen.muted = false; screen.volume = 1.0; }
          return;
        }

        if (data.type === 'header') {
          mediaSource = new MediaSource();
          screen.src = URL.createObjectURL(mediaSource);
          mediaSource.addEventListener('sourceopen', () => {
            try {
              sourceBuffer = mediaSource.addSourceBuffer(data.mime || 'video/mp4; codecs="avc1.42E01E, mp4a.40.2"');
              sourceBuffer.mode = 'sequence';
              sourceBuffer.addEventListener('updateend', () => {
                if (queue.length > 0 && !sourceBuffer.updating) sourceBuffer.appendBuffer(queue.shift());
              });
            } catch(e){}
          });
          document.getElementById('box').style.display = 'none';
          return;
        }

        if (data instanceof ArrayBuffer) {
          if (sourceBuffer && !sourceBuffer.updating && queue.length === 0) {
            try {
              sourceBuffer.appendBuffer(data);
              if (!started && screen.buffered.length > 0 && screen.buffered.end(0) > 1.2) {
                started = true;
                screen.muted = true;
                screen.play();
                stage.classList.add('open');
              }
            } catch(e) { queue.push(data); }
          } else {
            queue.push(data);
          }
        }
      });
    });
  </script>
</body>
</html>
