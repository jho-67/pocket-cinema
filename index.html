<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AirStream - Turbo Sender</title>
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #09090b; color: #fff; font-family: sans-serif;
      padding: 24px 16px; display: flex; justify-content: center; align-items: center; min-height: 100vh;
    }
    .card { background: #18181b; border: 1px solid #27272a; border-radius: 12px; padding: 20px; width: 100%; max-width: 400px; }
    h1 { color: #d4af37; font-size: 1.3rem; margin-bottom: 12px; text-align: center; }
    input { width: 100%; padding: 12px; background: #000; border: 1px solid #3f3f46; border-radius: 8px; color: #fff; font-size: 1rem; margin-bottom: 12px; }
    button { width: 100%; padding: 14px; border: none; border-radius: 8px; background: #d4af37; color: #000; font-weight: bold; font-size: 1rem; cursor: pointer; }
    button:disabled { opacity: 0.3; }
    .bar-bg { width: 100%; height: 8px; background: #27272a; border-radius: 4px; overflow: hidden; margin-top: 14px; }
    .bar-fill { width: 0%; height: 100%; background: #d4af37; transition: width 0.1s; }
    .stats { font-size: 0.8rem; color: #a1a1aa; margin-top: 6px; display: flex; justify-content: space-between; }
    #speed { color: #22c55e; font-weight: bold; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Turbo Transmitter</h1>

    <label style="font-size:0.8rem; color:#aaa;">1. Pick Video File:</label>
    <input type="file" id="filePicker">

    <label style="font-size:0.8rem; color:#aaa;">2. Receiver Code:</label>
    <input type="text" id="targetCode" placeholder="e.g. 5821" maxlength="4" inputmode="numeric">

    <button id="sendBtn" onclick="startTransmission()" disabled>Turbo Send</button>

    <div class="bar-bg"><div id="progress" class="bar-fill"></div></div>
    <div class="stats">
      <span id="transferred">0 MB</span>
      <span id="speed">0 MB/s</span>
      <span id="pct">0%</span>
    </div>
    <div id="status" style="font-size:0.85rem; color:#d4af37; margin-top:10px; text-align:center;"></div>
  </div>

  <script>
    const peer = new Peer();
    let selectedFile = null;
    let conn = null;

    const CHUNK_SIZE = 64 * 1024; // 64 KB protocol packet
    const HIGH_WATERMARK = 16 * 1024 * 1024; // 16 MB active transmission window
    const LOW_WATERMARK = 4 * 1024 * 1024;   // Refill point

    let offset = 0;
    let startTime = 0;
    let lastBytes = 0;
    let lastTime = 0;

    document.getElementById('filePicker').onchange = (e) => {
      selectedFile = e.target.files[0];
      if (selectedFile) {
        document.getElementById('sendBtn').disabled = false;
        document.getElementById('status').textContent = `${(selectedFile.size / (1024*1024)).toFixed(1)} MB ready`;
      }
    };

    function startTransmission() {
      const code = document.getElementById('targetCode').value.trim();
      if (code.length !== 4) return alert("Enter 4-digit code");

      document.getElementById('sendBtn').disabled = true;
      document.getElementById('status').textContent = "Connecting...";

      conn = peer.connect('filerecv-' + code, { reliable: true });

      conn.on('open', () => {
        document.getElementById('status').textContent = "Turbo streaming to storage...";
        const dc = conn.dataChannel;
        dc.bufferedAmountLowThreshold = LOW_WATERMARK;

        conn.send({
          type: 'start',
          name: selectedFile.name,
          size: selectedFile.size,
          mime: selectedFile.type
        });

        startTime = performance.now();
        lastTime = performance.now();
        offset = 0;

        // Drive transmission directly by the network hardware buffer
        dc.onbufferedamountlow = () => pump();
        pump();
      });
    }

    async function pump() {
      const dc = conn.dataChannel;

      // Keep pipeline saturated up to 16 MB
      while (offset < selectedFile.size && dc.bufferedAmount < HIGH_WATERMARK) {
        const slice = selectedFile.slice(offset, offset + CHUNK_SIZE);
        const buf = await slice.arrayBuffer();
        conn.send(buf);
        offset += CHUNK_SIZE;
        updateUI();
      }

      if (offset >= selectedFile.size && dc.bufferedAmount === 0) {
        conn.send({ type: 'eof' });
        document.getElementById('status').textContent = "Transfer complete!";
        document.getElementById('speed').textContent = "Done";
      }
    }

    function updateUI() {
      const current = Math.min(offset, selectedFile.size);
      const pct = Math.min(100, Math.round((current / selectedFile.size) * 100));
      document.getElementById('progress').style.width = pct + '%';
      document.getElementById('pct').textContent = pct + '%';
      document.getElementById('transferred').textContent = `${(current / (1024*1024)).toFixed(1)} MB`;

      // Live MB/s calculation
      const now = performance.now();
      if (now - lastTime > 400) {
        const speedMBs = ((current - lastBytes) / (1024 * 1024)) / ((now - lastTime) / 1000);
        document.getElementById('speed').textContent = `${speedMBs.toFixed(1)} MB/s`;
        lastBytes = current;
        lastTime = now;
      }
    }
  </script>
</body>
</html>
