<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Director Remote</title>
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #09090b;
      color: #fff;
      font-family: sans-serif;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .card {
      background: #18181b;
      border: 1px solid #27272a;
      border-radius: 12px;
      padding: 20px;
      width: 100%;
      max-width: 400px;
    }
    h1 { color: #d4af37; font-size: 1.3rem; margin-bottom: 12px; text-align: center; }
    input {
      width: 100%;
      padding: 12px;
      background: #000;
      border: 1px solid #3f3f46;
      border-radius: 8px;
      color: #fff;
      font-size: 1rem;
      margin-bottom: 12px;
    }
    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 8px;
      background: #d4af37;
      color: #000;
      font-weight: bold;
      font-size: 1rem;
      cursor: pointer;
    }
    button:disabled { opacity: 0.3; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 15px; }
    .grid button { background: #27272a; color: #fff; font-size: 0.9rem; padding: 12px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Director Remote</h1>
    
    <label style="font-size:0.8rem; color:#aaa;">1. Pick Movie File:</label>
    <input type="file" id="file" accept="video/*">

    <label style="font-size:0.8rem; color:#aaa;">2. Code from Screen Phone:</label>
    <input type="text" id="target" placeholder="e.g. 5821" maxlength="4" inputmode="numeric">

    <button id="sendBtn" onclick="startStream()" disabled>Start Cinema</button>
    <div id="status" style="font-size:0.8rem; color:#d4af37; margin-top:8px; text-align:center;"></div>

    <div id="deck" style="display:none;">
      <div class="grid">
        <button onclick="seek(-10)">⏪ -10s</button>
        <button onclick="seek(10)">⏩ +10s</button>
        <button id="toggleBtn" onclick="togglePlay()">⏸ Pause</button>
        <button onclick="sendCmd('fullscreen')" style="background:#2563eb; color:#fff;">⛶ Fullscreen</button>
        <button onclick="sendCmd('curtains')" style="background:#7a0c16; color:#fff; grid-column: span 2;">🎭 Curtains</button>
      </div>
    </div>
  </div>

  <!-- Hidden background video player feeding WebRTC -->
  <video id="engine" playsinline muted style="display:none;"></video>

  <script>
    const peer = new Peer();
    const engine = document.getElementById('engine');
    const sendBtn = document.getElementById('sendBtn');
    const status = document.getElementById('status');
    let dataConn = null;

    document.getElementById('file').onchange = (e) => {
      const file = e.target.files[0];
      if (file) {
        engine.src = URL.createObjectURL(file);
        sendBtn.disabled = false;
      }
    };

    function startStream() {
      const code = document.getElementById('target').value.trim();
      if (code.length !== 4) return alert("Enter 4-digit code");

      sendBtn.disabled = true;
      status.textContent = "Connecting...";

      dataConn = peer.connect('cinehall-' + code);

      engine.play().then(() => {
        // Request smooth 30 FPS stream capture
        const stream = engine.captureStream ? engine.captureStream(30) : engine.mozCaptureStream(30);
        const call = peer.call('cinehall-' + code, stream);

        // Boost bitrate to 10 Mbps (eliminates pixelation and blur)
        call.peerConnection.addEventListener('iceconnectionstatechange', () => {
          if (call.peerConnection.iceConnectionState === 'connected') {
            boostBitrate(call.peerConnection);
          }
        });

        status.textContent = "HD Cinema Broadcasting!";
        document.getElementById('deck').style.display = 'block';
      }).catch(err => {
        alert("Playback error: " + err);
        sendBtn.disabled = false;
      });
    }

    // Forces WebRTC to allocate HD bitrate instead of low video-call quality
    async function boostBitrate(pc) {
      const senders = pc.getSenders();
      const videoSender = senders.find(s => s.track && s.track.kind === 'video');
      if (videoSender) {
        try {
          const params = videoSender.getParameters();
          if (!params.encodings || params.encodings.length === 0) {
            params.encodings = [{}];
          }
          params.encodings[0].maxBitrate = 10000000; // 10 Mbps (Crystal Clear 1080p)
          params.encodings[0].networkPriority = 'high';
          await videoSender.setParameters(params);
        } catch (e) {
          console.warn("Bitrate boost warning:", e);
        }
      }
    }

    function togglePlay() {
      if (engine.paused) {
        engine.play();
        document.getElementById('toggleBtn').textContent = "⏸ Pause";
      } else {
        engine.pause();
        document.getElementById('toggleBtn').textContent = "▶ Resume";
      }
    }

    function seek(sec) {
      engine.currentTime = Math.max(0, engine.currentTime + sec);
    }

    function sendCmd(action) {
      if (dataConn && dataConn.open) dataConn.send({ type: 'control', action });
    }
  </script>
</body>
</html>
