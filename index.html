<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pocket Cinema</title>
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #050505;
      color: #f4f4f5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      width: 100vw;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    /* THEATER SCREEN (DEFAULT VIEW FOR PHONE B) */
    #ambient-glow {
      position: absolute;
      width: 82vw;
      height: 50vw;
      max-height: 70vh;
      border-radius: 40px;
      filter: blur(65px);
      opacity: 0.35;
      pointer-events: none;
      z-index: 1;
      transition: background 0.3s ease;
    }
    .stage {
      position: relative;
      width: 92vw;
      max-width: 960px;
      aspect-ratio: 16 / 9;
      background: #000;
      border-radius: 10px;
      box-shadow: 0 25px 60px rgba(0,0,0,0.95), 0 0 0 5px #18181b;
      overflow: hidden;
      z-index: 2;
    }
    video { width: 100%; height: 100%; object-fit: contain; background: #000; display: block; }
    .curtain {
      position: absolute;
      top: 0; bottom: 0; width: 50.5%;
      background: repeating-linear-gradient(90deg, #7a0c16 0px, #3b0006 18px, #7a0c16 36px);
      box-shadow: inset 0 0 40px rgba(0,0,0,0.85);
      z-index: 10;
      transition: transform 2.4s cubic-bezier(0.65, 0, 0.35, 1);
    }
    .curtain.left { left: 0; transform-origin: left center; }
    .curtain.right { right: 0; transform-origin: right center; }
    .stage.open .curtain.left { transform: scaleX(0.06) translateX(-50%); }
    .stage.open .curtain.right { transform: scaleX(0.06) translateX(50%); }
    .seats {
      position: absolute;
      bottom: 0; left: 0; right: 0; height: 44px;
      background: repeating-linear-gradient(90deg, #121212 0px, #121212 28px, transparent 28px, transparent 34px);
      border-top-left-radius: 12px;
      border-top-right-radius: 12px;
      z-index: 3;
      pointer-events: none;
      opacity: 0.6;
    }

    /* PAIRING OVERLAY ON SCREEN */
    #pairing-box {
      position: absolute;
      z-index: 20;
      background: rgba(12, 12, 14, 0.95);
      border: 1px solid #27272a;
      border-radius: 16px;
      padding: 24px;
      text-align: center;
    }
    .code-display { font-size: 3.2rem; letter-spacing: 8px; color: #d4af37; font-weight: 800; margin: 10px 0; }

    /* SWITCH TO CONTROLLER BUTTON */
    #switch-btn {
      position: fixed;
      top: 16px;
      right: 16px;
      z-index: 30;
      background: rgba(24, 24, 27, 0.85);
      color: #a1a1aa;
      border: 1px solid #3f3f46;
      border-radius: 8px;
      padding: 8px 14px;
      font-size: 0.8rem;
      cursor: pointer;
      backdrop-filter: blur(8px);
    }

    /* DIRECTOR REMOTE PANEL (OVERLAY FOR PHONE A) */
    #director-panel {
      display: none;
      position: fixed;
      inset: 0;
      background: #09090b;
      z-index: 50;
      overflow-y: auto;
      padding: 24px 16px;
      flex-direction: column;
      align-items: center;
    }
    .card {
      background: #18181b;
      border: 1px solid #27272a;
      border-radius: 16px;
      padding: 20px;
      width: 100%;
      max-width: 420px;
    }
    h1 { color: #d4af37; font-size: 1.4rem; text-align: center; margin-bottom: 6px; }
    p { color: #a1a1aa; font-size: 0.85rem; margin-bottom: 16px; text-align: center; }
    .text-input {
      width: 100%;
      padding: 12px;
      background: #09090b;
      border: 1px solid #3f3f46;
      border-radius: 8px;
      color: #fff;
      font-size: 1rem;
      margin-bottom: 12px;
    }
    button.action-btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 8px;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      background: #d4af37;
      color: #000;
    }
    button.action-btn:disabled { opacity: 0.35; cursor: not-allowed; }
    .bar-bg { width: 100%; height: 8px; background: #27272a; border-radius: 4px; overflow: hidden; margin-top: 12px; }
    .bar-fill { width: 0%; height: 100%; background: #d4af37; transition: width 0.1s; }
    .remote-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px; }
    .remote-grid button { padding: 12px; background: #27272a; color: #fff; border: 1px solid #3f3f46; border-radius: 8px; font-weight: 600; cursor: pointer; }
    .remote-grid button.primary { background: #d4af37; color: #000; border: none; }
  </style>
</head>
<body>

  <!-- BUTTON ON PHONE A TO OPEN CONTROLLER -->
  <button id="switch-btn" onclick="openDirectorRemote()">🎮 I'm the Director</button>

  <!-- SCREEN VIEW (DEFAULT) -->
  <div id="ambient-glow"></div>
  <div class="stage" id="cinema-stage">
    <div class="curtain left"></div>
    <div class="curtain right"></div>
    <video id="theater-screen" playsinline></video>
  </div>
  <div class="seats"></div>

  <div id="pairing-box">
    <p style="color: #a1a1aa; font-size: 0.95rem;">Theater Ready</p>
    <div class="code-display" id="display-code">----</div>
    <p id="status-label" style="color: #71717a; font-size: 0.8rem;">Enter this code on your controller phone</p>
  </div>

  <!-- DIRECTOR CONTROLLER MODAL -->
  <div id="director-panel">
    <div class="card">
      <h1>Director Console</h1>
      <p>Stream directly from your phone's storage.</p>
      
      <label style="font-size:0.85rem; color:#d4af37;">1. Pick Movie from Storage:</label>
      <input type="file" id="file-picker" accept="video/mp4,video/webm" class="text-input" style="margin-top:6px;">

      <label style="font-size:0.85rem; color:#d4af37;">2. Theater Code (from Screen Phone):</label>
      <input type="text" id="target-code" placeholder="e.g. 5821" maxlength="4" inputmode="numeric" class="text-input" style="margin-top:6px;">
      
      <button id="send-btn" class="action-btn" onclick="startHostStream()" disabled>Stream Movie to Screen</button>
      
      <div class="bar-bg"><div id="progress" class="bar-fill"></div></div>
      <div style="font-size:0.75rem; color:#a1a1aa; margin-top:6px; display:flex; justify-content:space-between;">
        <span id="transferred">0 MB</span>
        <span id="percentage">0%</span>
      </div>

      <div id="remote-deck" style="display: none; margin-top: 18px; border-top: 1px solid #27272a; padding-top: 14px;">
        <div class="remote-grid">
          <button onclick="sendCmd('rewind')">⏪ -10s</button>
          <button onclick="sendCmd('forward')">⏩ +10s</button>
          <button class="primary" id="toggle-play-btn" onclick="sendCmd('toggle')">⏸ Pause</button>
          <button onclick="sendCmd('unmute')">🔊 Unmute</button>
        </div>
        <button onclick="sendCmd('curtains')" style="width: 100%; margin-top: 10px; padding: 12px; background: #7a0c16; color: #fff; border: none; border-radius: 8px; font-weight: 600; cursor: pointer;">🎭 Open / Close Curtains</button>
      </div>
    </div>
  </div>

  <script>
    let peer = null;
    let selectedFile = null;
    let conn = null;
    let isPaused = false;
    const CHUNK_SIZE = 64 * 1024;

    /* 1. AUTO-SCREEN INITIALIZATION (DEFAULT ON LOAD) */
    const code = Math.floor(1000 + Math.random() * 9000).toString();
    document.getElementById('display-code').textContent = code;

    peer = new Peer('cinehall-' + code);
    const screen = document.getElementById('theater-screen');
    const stage = document.getElementById('cinema-stage');
    let mediaSource, sourceBuffer, chunkQueue = [], isStarted = false;
    let mime = 'video/mp4; codecs="avc1.42E01E, mp4a.40.2"';

    peer.on('connection', (c) => {
      document.getElementById('status-label').textContent = "Director connected. Preparing theater...";
      document.getElementById('switch-btn').style.display = 'none';

      c.on('data', (data) => {
        if (data.type === 'control') {
          if (data.action === 'toggle') screen.paused ? screen.play() : screen.pause();
          else if (data.action === 'rewind') screen.currentTime = Math.max(0, screen.currentTime - 10);
          else if (data.action === 'forward') screen.currentTime = Math.min(screen.duration || 9999, screen.currentTime + 10);
          else if (data.action === 'unmute') { screen.muted = false; screen.volume = 1.0; }
          else if (data.action === 'curtains') stage.classList.toggle('open');
          return;
        }

        if (data.type === 'header') {
          if (data.mime && MediaSource.isTypeSupported(data.mime)) mime = data.mime;
          mediaSource = new MediaSource();
          screen.src = URL.createObjectURL(mediaSource);
          mediaSource.addEventListener('sourceopen', () => {
            try {
              sourceBuffer = mediaSource.addSourceBuffer(mime);
              sourceBuffer.mode = 'sequence';
              sourceBuffer.addEventListener('updateend', () => {
                if (chunkQueue.length > 0 && !sourceBuffer.updating) sourceBuffer.appendBuffer(chunkQueue.shift());
              });
            } catch(e) {}
          });
          document.getElementById('pairing-box').style.display = 'none';
          return;
        }

        if (data.type === 'eof') {
          try { mediaSource.endOfStream(); } catch(e){}
          return;
        }

        if (data instanceof ArrayBuffer) {
          if (sourceBuffer && !sourceBuffer.updating && chunkQueue.length === 0) {
            try {
              sourceBuffer.appendBuffer(data);
              if (!isStarted && screen.buffered.length > 0 && screen.buffered.end(0) > 1.2) {
                isStarted = true;
                screen.muted = true;
                screen.play();
                stage.classList.add('open');
                setupAmbientGlow(screen);
              }
            } catch(e) { chunkQueue.push(data); }
          } else {
            chunkQueue.push(data);
          }
        }
      });
    });

    /* 2. DIRECTOR CONSOLE (PHONE A TOGGLE) */
    function openDirectorRemote() {
      document.getElementById('director-panel').style.display = 'flex';
      document.getElementById('switch-btn').style.display = 'none';
      if (peer) peer.destroy(); // Release receiver peer ID on Phone A
      peer = new Peer();

      const picker = document.getElementById('file-picker');
      const sendBtn = document.getElementById('send-btn');
      picker.addEventListener('change', (e) => {
        selectedFile = e.target.files[0];
        if (selectedFile) sendBtn.disabled = false;
      });
    }

    function startHostStream() {
      const targetCode = document.getElementById('target-code').value.trim();
      if (targetCode.length !== 4) return alert("Enter the 4-digit code shown on the screen");

      const sendBtn = document.getElementById('send-btn');
      sendBtn.disabled = true;
      sendBtn.textContent = "Connecting to Theater...";

      conn = peer.connect('cinehall-' + targetCode, { reliable: true });
      conn.on('open', () => {
        sendBtn.textContent = "Streaming to Cinema...";
        document.getElementById('remote-deck').style.display = 'block';
        conn.send({
          type: 'header',
          name: selectedFile.name,
          size: selectedFile.size,
          mime: selectedFile.type || 'video/mp4; codecs="avc1.42E01E, mp4a.40.2"'
        });
        transmitChunk(0);
      });
    }

    function transmitChunk(offset) {
      if (offset >= selectedFile.size) {
        conn.send({ type: 'eof' });
        document.getElementById('send-btn').textContent = "Movie Fully Loaded!";
        return;
      }
      if (conn.dataChannel.bufferedAmount > 4 * 1024 * 1024) {
        return setTimeout(() => transmitChunk(offset), 40);
      }
      const slice = selectedFile.slice(offset, offset + CHUNK_SIZE);
      const reader = new FileReader();
      reader.onload = (e) => {
        conn.send(e.target.result);
        const next = offset + CHUNK_SIZE;
        const pct = Math.min(100, Math.round((next / selectedFile.size) * 100));
        document.getElementById('progress').style.width = pct + '%';
        document.getElementById('percentage').textContent = pct + '%';
        document.getElementById('transferred').textContent = `${(Math.min(next, selectedFile.size)/(1024*1024)).toFixed(1)} MB`;
        setTimeout(() => transmitChunk(next), 0);
      };
      reader.readAsArrayBuffer(slice);
    }

    function sendCmd(action) {
      if (!conn || !conn.open) return;
      if (action === 'toggle') {
        isPaused = !isPaused;
        document.getElementById('toggle-play-btn').textContent = isPaused ? "▶ Resume" : "⏸ Pause";
      }
      conn.send({ type: 'control', action: action });
    }

    function setupAmbientGlow(videoEl) {
      const glow = document.getElementById('ambient-glow');
      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext('2d', { willReadFrequently: true });
      canvas.width = 16; canvas.height = 9;
      setInterval(() => {
        if (!videoEl.paused && !videoEl.ended) {
          ctx.drawImage(videoEl, 0, 0, 16, 9);
          const d = ctx.getImageData(0, 0, 16, 9).data;
          let r = 0, g = 0, b = 0;
          for (let i = 0; i < d.length; i += 4) { r += d[i]; g += d[i+1]; b += d[i+2]; }
          glow.style.background = `rgb(${Math.round(r/36)}, ${Math.round(g/36)}, ${Math.round(b/36)})`;
        }
      }, 300);
    }
  </script>
</body>
</html>
